<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APAC Research &amp; AI Insights Survey</title>
<meta name="description" content="A short survey on APAC sample sourcing and AI-moderated research.">
<meta name="theme-color" content="#0F1C33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E8EBF0;
    --surface:#FFFFFF;
    --ink:#0F1C33;
    --ink-2:#4E5A72;
    --line:#CBD2DE;
    --accent:#06379A;
    --accent-deep:#04266E;
    --accent-soft:#E3E9F5;
    --brass:#C0891F;
    --alert:#A8382A;
    --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
    --body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --r:10px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* class rules below set display:flex, which would otherwise win */
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
  }
  .wrap{
    max-width:600px;margin:0 auto;min-height:100svh;
    display:flex;flex-direction:column;
    background:var(--paper);
  }

  /* ---------- header / quota grid signature ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 20px 12px;
    display:flex;align-items:center;gap:14px;
  }
  .grid-track{display:flex;gap:5px;flex:1;flex-wrap:nowrap}
  .cell{
    flex:1;height:14px;max-width:22px;
    border:1px solid var(--line);border-radius:3px;
    background:var(--surface);
    transition:background .3s ease,border-color .3s ease,transform .3s ease;
  }
  .cell.done{background:var(--accent);border-color:var(--accent)}
  .cell.now{border:2px solid var(--brass);background:#FBF3E0;transform:translateY(-1px)}
  .counter{
    font-family:var(--mono);font-size:11px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
  }
  .banner{
    background:#FBF3E0;border-bottom:1px solid #E7D3A3;
    font-family:var(--mono);font-size:11px;letter-spacing:.05em;
    color:#7A5A11;padding:8px 20px;text-align:center;
  }

  /* ---------- stage ---------- */
  main{flex:1;padding:26px 20px 20px}
  .screen{animation:rise .28s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin:0 0 10px;
  }
  .eyebrow.center{text-align:center}
  h1{
    font-family:var(--display);font-weight:700;
    font-size:clamp(28px,7.4vw,38px);line-height:1.08;
    letter-spacing:-.02em;margin:0 0 16px;
  }
  h2{
    font-family:var(--display);font-weight:700;
    font-size:clamp(21px,5.4vw,26px);line-height:1.22;
    letter-spacing:-.015em;margin:0 0 8px;
  }
  .lede{color:var(--ink-2);margin:0 0 18px;font-size:15.5px}
  .help{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-2);margin:0 0 16px;
    display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  }
  .help .left{flex:1}
  .remaining{color:var(--brass);white-space:nowrap}
  .remaining.full{color:var(--alert)}

  /* ---------- options ---------- */
  .opts{display:flex;flex-direction:column;gap:8px;margin:0 0 8px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:14px 15px;
    font:inherit;color:var(--ink);text-align:left;cursor:pointer;
    transition:border-color .15s ease,background .15s ease,transform .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:active{transform:scale(.994)}
  .opt:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .opt .mark{
    flex:0 0 auto;width:20px;height:20px;margin-top:1px;
    border:1.5px solid var(--line);background:#fff;
    display:grid;place-items:center;transition:all .15s ease;
  }
  .opt[data-shape="square"] .mark{border-radius:5px}
  .opt[data-shape="circle"] .mark{border-radius:50%}
  .opt .mark svg{width:12px;height:12px;opacity:0;transform:scale(.6);transition:all .15s ease}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .opt[aria-pressed="true"] .mark{border-color:var(--accent);background:var(--accent)}
  .opt[aria-pressed="true"] .mark svg{opacity:1;transform:none}
  .opt[data-muted="true"]{opacity:.42}
  .opt .label{flex:1;font-size:15.5px;line-height:1.35}

  .otherbox{margin:4px 0 0;padding:0 0 0 32px}
  input[type="text"],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 13px;
  }
  input[type="text"]:focus,textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  textarea{min-height:150px;resize:vertical;line-height:1.5}
  .charcount{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;margin-top:6px}

  .err{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
    color:var(--alert);margin:12px 0 0;min-height:1em;
  }

  /* ---------- footer nav ---------- */
  .nav{
    position:sticky;bottom:0;z-index:20;
    background:linear-gradient(to bottom,rgba(232,235,240,0),var(--paper) 22%);
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    display:flex;gap:10px;align-items:center;
  }
  button.btn{
    font-family:var(--body);font-weight:600;font-size:16px;
    border-radius:var(--r);padding:15px 22px;border:1px solid transparent;
    cursor:pointer;transition:background .15s ease,transform .08s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--accent);color:#fff;flex:1}
  .btn.primary:hover{background:var(--accent-deep)}
  .btn.primary:active{transform:scale(.99)}
  .btn.primary[disabled]{background:#98A6C2;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line);padding:15px 18px}
  .btn.ghost:hover{background:#DCE1EA}

  /* ---------- terminal screens ---------- */
  .end{padding:40px 20px 60px;text-align:left}
  .seal{
    width:56px;height:56px;border-radius:14px;background:var(--accent);
    display:grid;place-items:center;margin:0 0 22px;
  }
  .seal svg{width:28px;height:28px}
  .end p{color:var(--ink-2);font-size:16px;max-width:46ch}
  .meta{
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-2);border-top:1px solid var(--line);margin-top:32px;padding-top:14px;
  }
  pre.dump{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.6;
    white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;margin-top:18px;
  }
  .spinner{
    width:18px;height:18px;border:2px solid rgba(255,255,255,.35);
    border-top-color:#fff;border-radius:50%;display:inline-block;
    vertical-align:-3px;margin-right:9px;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }
  @media (min-width:620px){
    main{padding:38px 28px 24px}
    .nav{padding:18px 28px 26px}
    .topbar{padding:16px 28px 14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner"></div>
  <header class="topbar" id="topbar" hidden>
    <div class="grid-track" id="track" aria-hidden="true"></div>
    <div class="counter" id="counter"></div>
  </header>

  <main id="stage" aria-live="polite"></main>

  <div class="nav" id="nav" hidden>
    <button class="btn ghost" id="back" type="button">Back</button>
    <button class="btn primary" id="next" type="button">Next</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — set your endpoint here, then re-upload the file.
   Leave endpoint empty to run in preview mode (nothing is saved).
   ============================================================ */
const CONFIG = {
  // Google Apps Script Web App URL, or a Formspree endpoint.
  endpoint: "https://script.google.com/macros/s/AKfycbz-uE8juUkSkj4e4yobNaPWCs63GK8bW4R8z_retjk23TQ4m024oYwk3VL-nv2lxBaI/exec",

  // Shown on the intro and thank-you screens. Leave empty to hide.
  organisation: ""
};

/* ============================================================
   SURVEY CONTENT

   type      "single" | "multi" | "text"
   max       cap on a multi-select
   exclusive options that clear every other selection when picked
   showIf    skip logic — question is only asked when this returns true
   ============================================================ */
const NO_AI_PLANS = "I have not conducted any AI-moderated interviews and do not plan to";
const RESEARCH_FIRM = "Market Research / Research Firm";

const QUESTIONS = [

  { id:"q01_region", type:"single",
    title:"Which region are you or your primary business unit based in?",
    options:[
      "North America (US & Canada)",
      "LATAM (Latin America & Caribbean)",
      "EMEA (Europe, Middle East, & Africa)",
      "APAC (Asia-Pacific, including Australia & New Zealand)",
      "Other"] },

  { id:"q02_industry", type:"single",
    title:"Which of the following best describes your company's primary industry?",
    options:[
      "Consumer Goods / Food & Beverage (FMCG)",
      "Beauty / Personal Care",
      "Fashion / Apparel",
      "Retail / E-commerce",
      "Finance / Insurance",
      "Healthcare / Pharmaceuticals",
      "Technology / IT",
      "Automotive / Mobility",
      "Media / Entertainment",
      "Advertising / PR / Marketing Agency",
      RESEARCH_FIRM,
      "Consulting",
      "Other"] },

  { id:"q03_role", type:"single",
    // Skipped for research firms — the role list doesn't fit that side of the table.
    showIf: a => !a.q02_industry.values.includes(RESEARCH_FIRM),
    title:"What best describes your primary role or function?",
    options:[
      "Consumer Insights / Market Research",
      "Marketing / Brand Management",
      "Product Development / Innovation",
      "Data Science / Analytics",
      "Executive Leadership (C-Suite, VP, GM)",
      "Other"] },

  { id:"q04_experience", type:"single",
    title:"How many years of experience do you have in market research, marketing, or insights?",
    options:[
      "Less than 3 years",
      "3 to 5 years",
      "6 to 10 years",
      "11 to 15 years",
      "More than 15 years"] },

  { id:"q05_apac_challenges", type:"multi", max:3,
    title:"What are your biggest challenges when buying APAC sample or working with APAC suppliers?",
    help:"Select up to 3.",
    options:[
      "Data Quality & Fraud: Poor sample quality or high drop-out rates",
      "Audience Reach: Difficulty finding niche, B2B, or hard-to-reach target audiences",
      "Speed & Communication: Slow field delivery, poor supplier communication, or long overall timelines",
      "Budget & Cost: High costs or uncompetitive pricing",
      "Cultural Expertise: Navigating language nuances, cultural barriers, or a lack of local market guidance",
      "Compliance: Navigating strict data privacy regulations (e.g., cross-border data transfers)",
      "Technology: Platform integration friction or technical setup issues",
      "I do not procure sample in APAC"],
    exclusive:["I do not procure sample in APAC"] },

  { id:"q06_synthetic_adoption", type:"single",
    title:"How would you describe your organization's current perception and adoption of Synthetic Insight Tools?",
    help:"For example, AI personas or synthetic data generation.",
    options:[
      "Active Adopter: We are already using synthetic data / AI personas for live projects.",
      "Experimenter: We are currently running pilots or testing AI research vendors.",
      "Curious: We aren't using them yet, but we are actively evaluating the technology.",
      "Skeptical: We are watching the trends, but we are hesitant to trust AI outputs yet.",
      "Resistant: We have no interest and believe it poses too much risk to data integrity."] },

  { id:"q07_ai_interview_frequency", type:"single",
    title:"How often do you, or do you plan to, conduct AI-moderated interviews?",
    options:[
      "Once a month or less",
      "Once every 2-3 months",
      "Once every 6 months",
      "Once a year or less",
      "I have not conducted any AI-moderated interviews, but plan to within the next 3-6 months",
      NO_AI_PLANS] },

  { id:"q08_ai_interview_regions", type:"multi",
    // Skipped for anyone with no plans to run AI-moderated interviews.
    showIf: a => !a.q07_ai_interview_frequency.values.includes(NO_AI_PLANS),
    title:"In which regions do you currently conduct, or plan to conduct, AI-moderated interviews?",
    help:"Select all that apply.",
    options:[
      "North America (US & Canada)",
      "LATAM (Latin America & Caribbean)",
      "EMEA (Europe, Middle East, & Africa)",
      "APAC - Japan",
      "APAC - China / Greater China",
      "APAC - South Korea",
      "APAC - Southeast Asia (e.g., Singapore, Indonesia, Vietnam, Thailand)",
      "APAC - India",
      "APAC - Australia / New Zealand"] },

  { id:"q09_ai_interview_impressions", type:"multi",
    title:"What are your impressions of AI-moderated interviews?",
    help:"Select all that apply.",
    options:[
      "Faster project turnaround",
      "Automated or easier questionnaire creation",
      "Instant generation of insights reports",
      "Ability to scale qualitative research easily",
      "Cost efficiency compared to human moderators",
      "Multi-language capabilities",
      "Insights reports were shallow or inaccurate",
      "The AI lacked deep human empathy and probing",
      "Setting up the questionnaire / prompts was difficult",
      "High participant drop-off or poor engagement",
      "Struggled with local language or cultural nuances",
      "Data privacy or compliance issues",
      "None of the above"],
    exclusive:["None of the above"] },

  { id:"q10_synthetic_use_cases", type:"multi",
    title:"If you already use, or were to use, AI Synthetic Insight Tools in your work, what kind of use cases would you consider?",
    help:"Select all that apply.",
    options:[
      "Consumer insight collection and analysis",
      "Advertising / creative testing and validation",
      "Product / service concept testing",
      "Marketing strategy planning and simulation",
      "Competitive and market trend analysis",
      "Customer segmentation design and validation",
      "Collecting insights without using personal data",
      "Other (please specify)",
      "I do not, and would not, use AI Synthetic Insight Tools"],
    exclusive:["I do not, and would not, use AI Synthetic Insight Tools"] },

  { id:"q11_synthetic_barrier", type:"single",
    title:"What is your primary concern or barrier regarding the use of synthetic data in market research?",
    options:[
      "AI hallucinations (fear that the AI will invent inaccurate consumer behaviors)",
      "Lack of “ground truth” (no real human data to validate the AI against)",
      "Data privacy, copyright, or security risks",
      "Pushback from internal stakeholders who only trust traditional human research",
      "We lack the internal technical expertise to deploy it",
      "Other (please specify)",
      "I have no major concerns"] }
];

/* ============================================================
   STATE
   ============================================================ */
const state = {
  step: -1,                  // -1 = intro, otherwise an index into QUESTIONS
  answers: {},
  startedAt: Date.now(),
  sending: false,
  finished: false            // once true the survey is closed — no going back
};
QUESTIONS.forEach(q => state.answers[q.id] = { values: [], other: "", text: "" });

const $ = s => document.querySelector(s);
const stage = $("#stage"), nav = $("#nav"), topbar = $("#topbar"),
      track = $("#track"), counter = $("#counter"),
      backBtn = $("#back"), nextBtn = $("#next");

const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const isOther = v => v.startsWith("Other (please specify)");
const answered = q => q.type === "text"
  ? (q.optional || state.answers[q.id].text.trim().length > 0)
  : state.answers[q.id].values.length > 0;

/* ---- skip logic -------------------------------------------------
   A question is asked only when its showIf passes. Visibility depends
   solely on earlier answers, so the path is always resolved by the time
   the respondent reaches a question.                                */
const visible = q => !q.showIf || q.showIf(state.answers);
const flow    = () => QUESTIONS.filter(visible);

function nextIndex(from){
  for(let i = from + 1; i < QUESTIONS.length; i++) if(visible(QUESTIONS[i])) return i;
  return -1;
}
function prevIndex(from){
  for(let i = from - 1; i >= 0; i--) if(visible(QUESTIONS[i])) return i;
  return -1;
}

/* ============================================================
   RENDER
   ============================================================ */
function renderChrome(){
  if(state.step < 0){ topbar.hidden = true; return; }
  topbar.hidden = false;
  const path = flow();
  const pos  = path.indexOf(QUESTIONS[state.step]);   // 0-based position on the path
  track.innerHTML = path.map((q,i) =>
    `<div class="cell ${i < pos ? "done" : ""} ${i === pos ? "now" : ""}"></div>`
  ).join("");
  counter.textContent = `Q${pos + 1} / ${path.length}`;
}

function renderIntro(){
  nav.hidden = false;
  backBtn.hidden = true;
  nextBtn.textContent = "Start the survey";
  stage.innerHTML = `
    <div class="screen">
      <p class="eyebrow center">APAC research study</p>
      <h1>Sample, AI, and the future of APAC research</h1>
      <p class="lede">We'd like to understand how research teams are sourcing sample across APAC, and
      how they're approaching AI-moderated interviews and synthetic insight tools.</p>
      <p class="lede">Your feedback will help identify where suppliers can better support researchers —
      on recruitment and quality, and on the new tools now entering the workflow.</p>
      <p class="lede">Responses are anonymous and reported in aggregate.</p>
      ${CONFIG.organisation ? `<p class="meta">Run by ${CONFIG.organisation}</p>` : ""}
    </div>`;
}

function renderQuestion(){
  const q = QUESTIONS[state.step];
  const a = state.answers[q.id];
  nav.hidden = false;
  backBtn.hidden = prevIndex(state.step) === -1;
  nextBtn.textContent = nextIndex(state.step) === -1 ? "Submit answers" : "Next";

  let helpRow = "";
  if(q.help || q.max){
    const left = q.max ? q.max - a.values.length : null;
    helpRow = `<div class="help">
      <span class="left">${q.help || ""}</span>
      ${q.max ? `<span class="remaining ${left === 0 ? "full" : ""}" id="remaining">${
        left === 0 ? "Limit reached" : `${left} left`}</span>` : ""}
    </div>`;
  }

  let field;
  if(q.type === "text"){
    field = `<textarea id="freetext" placeholder="${q.placeholder || ""}"
      maxlength="600">${a.text.replace(/</g,"&lt;")}</textarea>
      <div class="charcount"><span id="cc">${a.text.length}</span> / 600</div>`;
  } else {
    const shape = q.type === "single" ? "circle" : "square";
    const atMax = q.max && a.values.length >= q.max;
    field = `<div class="opts" role="group">` + q.options.map((opt,i) => {
      const on = a.values.includes(opt);
      const muted = !on && (atMax || (q.exclusive && a.values.some(v => q.exclusive.includes(v))));
      return `<button class="opt" type="button" data-shape="${shape}" data-opt="${i}"
        aria-pressed="${on}" data-muted="${muted}">
        <span class="mark">${TICK}</span><span class="label">${opt}</span>
      </button>` + (isOther(opt) && on
        ? `<div class="otherbox"><input type="text" id="otherinput" maxlength="120"
             placeholder="Please specify" value="${a.other.replace(/"/g,"&quot;")}"></div>`
        : "");
    }).join("") + `</div>`;
  }

  stage.innerHTML = `
    <div class="screen">
      <p class="eyebrow">Question ${flow().indexOf(q) + 1}</p>
      <h2>${q.title}</h2>
      ${helpRow}
      ${field}
      <p class="err" id="err"></p>
    </div>`;

  stage.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => toggle(q, q.options[+btn.dataset.opt]));
  });
  const oi = $("#otherinput");
  if(oi){ oi.addEventListener("input", e => a.other = e.target.value); }
  const ft = $("#freetext");
  if(ft){ ft.addEventListener("input", e => { a.text = e.target.value; $("#cc").textContent = e.target.value.length; }); }
}

function toggle(q, opt){
  if(state.finished) return;
  const a = state.answers[q.id];
  const on = a.values.includes(opt);

  if(q.type === "single"){
    a.values = on ? [] : [opt];
    if(!a.values.some(isOther)) a.other = "";
    renderQuestion();
    if(!on && isOther(opt)){ const oi = $("#otherinput"); if(oi) oi.focus(); return; }
    if(!on) setTimeout(() => goNext(true), 210);   // auto-advance
    return;
  }

  if(on){
    a.values = a.values.filter(v => v !== opt);
    if(isOther(opt)) a.other = "";
  } else {
    if(q.exclusive && q.exclusive.includes(opt)){ a.values = [opt]; a.other = ""; }
    else {
      if(q.exclusive) a.values = a.values.filter(v => !q.exclusive.includes(v));
      if(q.max && a.values.length >= q.max){
        const r = $("#remaining");
        if(r){ r.textContent = `Limit reached — deselect one first`; r.classList.add("full"); }
        return;
      }
      a.values.push(opt);
    }
  }
  renderQuestion();
  if(isOther(opt) && !on){ const oi = $("#otherinput"); if(oi) oi.focus(); }
}

/* ============================================================
   NAVIGATION + VALIDATION
   ============================================================ */
function goNext(auto){
  if(state.finished) return;
  if(state.step === -1){ state.step = nextIndex(-1); paint(); return; }

  const q = QUESTIONS[state.step], a = state.answers[q.id];
  if(!answered(q)){ return fail("Please choose an answer to continue."); }
  if(a.values.some(isOther) && !a.other.trim()){ return fail("Please specify your answer."); }

  const nxt = nextIndex(state.step);
  if(nxt === -1){ return finish("complete"); }
  state.step = nxt;
  paint();
  if(!auto) window.scrollTo({ top:0, behavior:"instant" });
}

function goBack(){
  if(state.finished) return;
  const prv = prevIndex(state.step);
  state.step = prv === -1 ? -1 : prv;
  paint();
}

function fail(msg){
  const e = $("#err");
  if(e){ e.textContent = msg; }
  if(navigator.vibrate) navigator.vibrate(12);
}

function paint(){
  renderChrome();
  state.step === -1 ? renderIntro() : renderQuestion();
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ============================================================
   SUBMISSION
   ============================================================ */
function buildPayload(status){
  const p = {
    submitted_at: new Date().toISOString(),
    status,
    duration_seconds: Math.round((Date.now() - state.startedAt) / 1000)
  };
  QUESTIONS.forEach(q => {
    const a = state.answers[q.id];
    // A question the respondent was routed past stays blank, even if they
    // backtracked and answered it under a different path earlier.
    if(!visible(q)){ p[q.id] = ""; return; }
    if(q.type === "text"){ p[q.id] = a.text.trim(); return; }
    p[q.id] = a.values.map(v => isOther(v) ? `Other: ${a.other.trim()}` : v).join(" | ");
  });
  return p;
}

async function send(payload){
  const url = CONFIG.endpoint.trim();
  if(!url) return { ok:true, previewed:true };
  const body = JSON.stringify(payload);

  if(url.includes("script.google.com")){
    // Apps Script can't answer a CORS preflight, so we can't read its reply either way.
    // sendBeacon hands the request to the browser to deliver in the background — the
    // thank-you screen shows immediately instead of waiting on Google's servers.
    try{
      if(navigator.sendBeacon){
        const blob = new Blob([body], { type:"text/plain;charset=utf-8" });
        if(navigator.sendBeacon(url, blob)) return { ok:true };
      }
    }catch(err){ /* fall through to fetch */ }
    try{
      fetch(url, { method:"POST", mode:"no-cors", keepalive:true,
        headers:{ "Content-Type":"text/plain;charset=utf-8" }, body });
      return { ok:true };
    }catch(err){
      return { ok:false, error: String(err) };
    }
  }

  try{
    const res = await fetch(url, { method:"POST",
      headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body });
    return { ok: res.ok };
  }catch(err){
    return { ok:false, error: String(err) };
  }
}

async function finish(status){
  if(state.sending || state.finished) return;
  state.sending = true;
  nextBtn.disabled = true;
  nextBtn.innerHTML = '<span class="spinner"></span>Sending';

  const payload = buildPayload(status);
  const result = await send(payload);
  state.sending = false;

  if(!result.ok){
    nextBtn.disabled = false;
    nextBtn.textContent = "Try again";
    return fail("Couldn't send your answers. Check your connection and tap Try again.");
  }
  renderEnd(status, payload, result.previewed);
}

function renderEnd(status, payload, previewed){
  state.finished = true;
  // Remove the chrome outright rather than hiding it — nothing to tap, nothing to
  // navigate back to. The next person has to scan the code again.
  topbar.remove();
  nav.remove();
  const b = $("#banner"); if(b) b.remove();

  stage.innerHTML = `
    <div class="screen end">
      <div class="seal">${TICK}</div>
      <h1>Thank you!</h1>
      <p>Thank you for sharing your insights. Your feedback will help us better understand the
      evolving needs of the APAC market research industry — both how sample providers can better
      support researchers, and how AI and synthetic tools are finding a place in the work.</p>
      ${CONFIG.organisation ? `<p class="meta">${CONFIG.organisation}</p>` : ""}
      ${previewed ? `<p class="meta">Preview mode — this response was not saved. Add an endpoint in CONFIG to collect responses.</p>
        <pre class="dump">${JSON.stringify(payload, null, 2)}</pre>` : ""}
    </div>`;
  window.scrollTo({ top:0, behavior:"instant" });
}

/* ============================================================
   BOOT
   ============================================================ */
nextBtn.addEventListener("click", () => goNext(false));
backBtn.addEventListener("click", goBack);
document.addEventListener("keydown", e => {
  if(state.finished) return;
  if(e.key === "Enter" && e.target.tagName !== "TEXTAREA" && !nav.hidden){ goNext(false); }
});
if(!CONFIG.endpoint.trim()){
  $("#banner").className = "banner";
  $("#banner").textContent = "PREVIEW MODE — RESPONSES ARE NOT BEING SAVED";
}
paint();
</script>
</body>
</html>
